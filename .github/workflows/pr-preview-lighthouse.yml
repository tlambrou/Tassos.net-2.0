name: PR Preview and Lighthouse

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: pr-preview-lighthouse-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-lighthouse:
    name: Test, deploy preview, and run Lighthouse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Pull Vercel preview environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Vercel preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel build --token="$VERCEL_TOKEN"

      - name: Deploy Vercel preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -o pipefail
          npx vercel deploy --prebuilt --token="$VERCEL_TOKEN" 2>&1 | tee vercel-deploy.log
          preview_url="$(grep -Eo 'https://[^ ]+\.vercel\.app' vercel-deploy.log | tail -n 1)"
          if [ -z "$preview_url" ]; then
            echo "::error::Unable to determine Vercel preview URL"
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $preview_url"

      - name: Smoke test preview URL
        run: curl --fail --show-error --silent --location --head "${{ steps.deploy.outputs.preview_url }}"

      - name: Run Lighthouse mobile
        run: |
          npx lighthouse@12.8.2 "${{ steps.deploy.outputs.preview_url }}" \
            --quiet \
            --chrome-flags="--headless=new --no-sandbox" \
            --output=json \
            --output-path=./lighthouse-mobile.json

      - name: Run Lighthouse desktop
        run: |
          npx lighthouse@12.8.2 "${{ steps.deploy.outputs.preview_url }}" \
            --quiet \
            --preset=desktop \
            --chrome-flags="--headless=new --no-sandbox" \
            --output=json \
            --output-path=./lighthouse-desktop.json

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: |
            lighthouse-mobile.json
            lighthouse-desktop.json

      - name: Comment Lighthouse scores
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: node .github/scripts/comment-lighthouse-results.js lighthouse-mobile.json lighthouse-desktop.json
